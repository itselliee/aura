# This starter workflow is for a CMake project running on multiple platforms.
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Grant write permissions for GitHub Releases
permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl

    steps:
    - uses: actions/checkout@v4

    # Install Linux Dependencies (OpenGL + GLFW + Virtual Display)
    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgl1-mesa-dev \
          libglu1-mesa-dev \
          libx11-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          libglfw3-dev \
          xvfb

    # Install Windows Dependencies via vcpkg
    - name: Install Dependencies (Windows)
      if: runner.os == 'Windows'
      run: vcpkg install glfw3:x64-windows

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      shell: bash
      run: |
        EXTRA_ARGS=""
        if [ "${{ runner.os }}" = "Windows" ]; then
          EXTRA_ARGS="-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
        fi

        cmake -B "${{ steps.strings.outputs.build-output-dir }}" -DCMAKE_CXX_COMPILER="${{ matrix.cpp_compiler }}" -DCMAKE_C_COMPILER="${{ matrix.c_compiler }}" -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" $EXTRA_ARGS -S "${{ github.workspace }}"

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      shell: bash
      run: |
        if [ "${{ runner.os }}" = "Linux" ]; then
          xvfb-run ctest --build-config ${{ matrix.build_type }}
        else
          ctest --build-config ${{ matrix.build_type }}
        fi

    # --- NEW STEP: Package Executables into ZIP ---
    - name: Package Executables
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      shell: bash
      run: |
        mkdir -p dist
        BUILD_DIR="${{ steps.strings.outputs.build-output-dir }}"
        
        # Copy compiled executables to staging directory
        if [ "${{ runner.os }}" = "Windows" ]; then
          # Visual Studio places output in build/Release/
          cp $BUILD_DIR/Release/*.exe dist/ 2>/dev/null || cp $BUILD_DIR/*.exe dist/
        else
          # Single-config generators place executables in build/
          find $BUILD_DIR -maxdepth 1 -type f -executable -exec cp {} dist/ \;
        fi

        # Generate unique zip name per matrix job
        ARCHIVE_NAME="aura-${{ matrix.os }}-${{ matrix.c_compiler }}"
        
        # Zip using Python (pre-installed cross-platform tool)
        python -c "import shutil; shutil.make_archive('$ARCHIVE_NAME', 'zip', 'dist')"
        
        echo "ZIP_FILE=${ARCHIVE_NAME}.zip" >> "$GITHUB_ENV"

    # --- NEW STEP: Create/Update Nightly Release ---
    - name: Upload to Nightly Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: nightly
        name: "Nightly Build"
        body: "Automated rolling nightly build generated from the latest `main` branch commit."
        prerelease: true
        files: ${{ env.ZIP_FILE }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
