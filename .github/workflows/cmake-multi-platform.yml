name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl
          - os: macos-latest
            c_compiler: gcc
          - os: macos-latest
            c_compiler: cl

    steps:
    - uses: actions/checkout@v4

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgl1-mesa-dev \
          libglu1-mesa-dev \
          libx11-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          xvfb

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      shell: bash
      run: |
        EXTRA_ARGS=""

        cmake -B "${{ steps.strings.outputs.build-output-dir }}" \
          -DCMAKE_CXX_COMPILER="${{ matrix.cpp_compiler }}" \
          -DCMAKE_C_COMPILER="${{ matrix.c_compiler }}" \
          -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" \
          $EXTRA_ARGS \
          -S "${{ github.workspace }}"

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      shell: bash
      run: |
        if [ "${{ runner.os }}" = "Linux" ]; then
          xvfb-run ctest --build-config ${{ matrix.build_type }}
        else
          ctest --build-config ${{ matrix.build_type }}
        fi

    - name: Package Executables
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      shell: bash
      run: |
        mkdir -p dist
        BUILD_DIR=$(echo "${{ steps.strings.outputs.build-output-dir }}" | tr '\\' '/')
        
        if [ "${{ runner.os }}" = "Windows" ]; then
          find "$BUILD_DIR" -type f -name "*.exe" ! -path "*/CMakeFiles/*" -exec cp {} dist/ \;
        else
          # Compatible with both GNU find (Linux) and BSD find (macOS)
          find "$BUILD_DIR" -type f ! -path "*/CMakeFiles/*" -exec test -x {} \; -exec cp {} dist/ \;
        fi

        if [ -z "$(ls -A dist)" ]; then
          echo "Error: No compiled executables were found in $BUILD_DIR"
          exit 1
        fi

        ARCHIVE_NAME="aura-${{ matrix.os }}-${{ matrix.c_compiler }}"
        python3 -c "import shutil; shutil.make_archive('$ARCHIVE_NAME', 'zip', 'dist')"
        echo "ZIP_FILE=${ARCHIVE_NAME}.zip" >> "$GITHUB_ENV"

    - name: Upload to Nightly Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: nightly
        name: "Nightly Build"
        body: "Automated rolling nightly build generated from the latest `main` branch commit."
        prerelease: true
        files: ${{ env.ZIP_FILE }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
